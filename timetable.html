<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghostflights timetables: departed airlines&#x27; flights in the air now</title>
<meta name="description" content="Ghostflights has departures boards for Pan Am, Northwest Orient, Eastern, Braniff and more from their real 1985 timetables. See which flights are in the air at this hour.">
<link rel="canonical" href="https://ghostflights.tv/timetable.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ghostflights">
<meta property="og:title" content="Ghostflights timetables: departed airlines&#x27; flights in the air now">
<meta property="og:description" content="Ghostflights has departures boards for Pan Am, Northwest Orient, Eastern, Braniff and more from their real 1985 timetables. See which flights are in the air at this hour.">
<meta property="og:url" content="https://ghostflights.tv/timetable.html">
<meta property="og:image" content="https://ghostflights.tv/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="site.css">
<style>
  /* The phone's way in: each airline as a 1985 airport departures board, in the station's amber on its night navy
     (site.css), from the same schedule engine as the broadcast (feed.js). */
  main { max-width: 560px; margin: 0 auto; font: 16px/1.3 var(--cg); letter-spacing: 0.02em; }
  .chipbar { position: sticky; top: 51px; z-index: 2; background: rgba(10, 12, 34, 0.94); border-bottom: 1px solid var(--rule); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; max-width: 560px; margin: 0 auto; box-sizing: border-box; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  /* Arrows at the bar's ends, so it's plain the airlines scroll sideways; each hides at its end. */
  .chipwrap { position: relative; max-width: 560px; margin: 0 auto; }
  .chipwrap .arrow { position: absolute; top: 0; bottom: 0; width: 40px; border: 0; padding: 0; cursor: pointer; z-index: 1;
    color: var(--amber); font: 22px/1 var(--cg); }
  .chipwrap .arrow.left { left: 0; background: linear-gradient(90deg, rgba(10, 12, 34, 1) 55%, rgba(10, 12, 34, 0)); text-align: left; padding-left: 8px; }
  .chipwrap .arrow.right { right: 0; background: linear-gradient(270deg, rgba(10, 12, 34, 1) 55%, rgba(10, 12, 34, 0)); text-align: right; padding-right: 8px; }
  .chipwrap .arrow[hidden] { display: none; }
  .chips button { flex: none; border: 1px solid var(--rule); background: var(--panel); color: var(--white); font: inherit; font-size: 14px;
    padding: 7px 10px; border-radius: 3px; cursor: pointer; text-transform: uppercase; }
  .chips button span { color: var(--quiet); margin-right: 5px; }
  .chips button.on { border-color: var(--amber); color: var(--amber); }
  .hero { padding: 16px 16px 8px; }
  .hero h1 { margin: 0; font-size: 30px; text-transform: uppercase; letter-spacing: 0.04em; }
  .hero .when { color: var(--amber); font-size: 15px; margin-top: 2px; text-transform: uppercase; }
  .hero img { display: block; width: 100%; margin: 14px 0 4px; }
  .hero .paint { color: var(--quiet); font-size: 13px; text-transform: uppercase; }
  h2 { margin: 22px 16px 6px; font-size: 14px; color: var(--amber); letter-spacing: 0.14em; display: flex; justify-content: space-between; }
  h2 small { color: var(--quiet); font-size: 13px; letter-spacing: 0.04em; }
  .row { display: grid; grid-template-columns: 76px 1fr auto; gap: 2px 10px; align-items: center; padding: 9px 16px; border-top: 1px solid var(--rule);
    cursor: pointer; text-transform: uppercase; }
  .row:nth-child(odd) { background: rgba(255, 255, 255, 0.025); }
  .row img { width: 76px; grid-row: span 2; }
  .row .route { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t { font-size: 18px; color: var(--amber); text-align: right; }
  .row .sub { font-size: 13px; color: var(--quiet); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .st { font-size: 13px; color: var(--blue); text-align: right; white-space: nowrap; }
  .dep { grid-template-columns: 64px 1fr auto; }
  .dep .t { text-align: left; }
  .card { position: fixed; inset: 0; z-index: 5; background: rgba(4, 5, 16, 0.82); display: none; align-items: center; justify-content: center; padding: 16px; }
  .card.on { display: flex; }
  .card > div { position: relative; width: 100%; max-width: 520px; max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; background: var(--panel);
    border: 1px solid var(--rule); border-top: 3px solid var(--amber); border-radius: 6px; padding: 18px 16px 22px; font-family: var(--cg); letter-spacing: 0.02em; text-transform: uppercase; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6); }
  .card .close { position: absolute; top: 10px; right: 12px; color: var(--quiet); font-size: 14px; letter-spacing: 0.08em; cursor: pointer; }
  .card .close:hover { color: var(--white); }
  .card.on { cursor: pointer; } /* a click anywhere closes it */
  .card.on > div { cursor: auto; }
  .card img { width: 100%; margin: 8px 0 12px; }
  .card .big { font-size: 26px; }
  .card dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 10px 0 0; font-size: 15px; }
  .card dt { color: var(--quiet); }
  .card .src { color: var(--quiet); font-size: 12px; margin-top: 14px; text-transform: none; letter-spacing: 0.01em; }
  /* Where the flight is along its route: the two airports, the part flown in amber and the plane's light on it. */
  .trip { margin: 4px 0 14px; text-transform: uppercase; }
  .card .where { font-size: 17px; color: var(--amber); margin: 0 0 10px; text-transform: uppercase; }
  .card .where .sky { display: block; color: var(--white); font-size: 14px; margin-top: 4px; text-transform: none; letter-spacing: 0.01em; }
  .trip .ends, .trip .times { display: flex; justify-content: space-between; font-size: 15px; }
  .trip .times { color: var(--quiet); font-size: 13px; }
  .trip .track { position: relative; height: 14px; margin: 6px 7px; }
  .trip .track::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--rule); }
  .trip .done { position: absolute; left: 0; top: 6px; height: 2px; background: var(--amber); }
  .trip .end { position: absolute; top: 3px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--white); }
  .trip .now { position: absolute; top: 1px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--amber);
    box-shadow: 0 0 8px 2px rgba(255, 191, 46, 0.55); }
  footer { color: var(--quiet); font-size: 12px; padding: 26px 16px 40px; line-height: 1.5; letter-spacing: 0.01em; }
  footer a { color: var(--amber); }
</style>
</head>
<body>
<header class="site"><a class="brand" href="index.html">GHOSTFLIGHTS</a>
  <nav><a href="index.html?tv=1">Watch</a><a href="timetable.html" aria-current="page">Timetables</a><a href="airlines/index.html">Airlines</a><a href="about.html">About</a><a href="api.html">API</a></nav></header>
<div class="chipbar"><div class="chipwrap"><button class="arrow left" type="button" aria-label="Earlier channels" hidden>‹</button><nav class="chips" id="chips"></nav><button class="arrow right" type="button" aria-label="Later channels">›</button></div></div>
<main>
<section class="hero" id="hero"></section>
<h2>IN THE AIR <small id="airCount"></small></h2>
<div id="air"></div>
<h2>NEXT DEPARTURES <small id="depNote"></small></h2>
<div id="deps"></div>
<footer>The schedules are real and the flights are simulated. Since nobody tracked planes like this in 1985, each flight is placed along its route by its timetable times. <a href="about.html">About Ghostflights</a> · <a href="api.html">The flights as data</a></footer>
</main>
<div class="card" id="card"><div id="cardBody"></div></div>

<script src="data.js"></script>
<script src="sprites.js"></script>
<script src="feed-data.js"></script>
<script src="feed.js"></script>
<script>
(() => {
  const B = window.BOARD, D = window.GHOSTFLIGHTS_DATA, G = window.Ghostflights, DAY = 86400000;
  const params = new URLSearchParams(location.search);
  const START = params.get('t') ? Date.parse(params.get('t')) : Date.now(), REAL = Date.now();
  const now = () => START + (Date.now() - REAL);
  const channels = Object.entries(B.boards).filter(([c]) => /^\d+$/.test(c));
  let ch = params.get('ch') && B.boards[params.get('ch')] ? params.get('ch') : '8';

  const city = (code) => B.cities[code] || code;
  const paint = (type, number) => (type.paints ? type.paints[type.deck[number % type.deck.length]] : type);
  const sprite = (f) => window.SPRITES[`sprites/${f.sprite}-left.svg`];
  const clock = (ms, tz) => new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tz || 'UTC' });
  // A time in a schedule row's own local time: its UTC moment less the row's offset.
  const localTime = (ms, offset) => clock(ms - offset * 60000);

  const chips = document.getElementById('chips');
  for (const [c, b] of channels) {
    const btn = Object.assign(document.createElement('button'), { innerHTML: `<span>${c}</span>${b.name}` });
    btn.onclick = () => { ch = c; history.replaceState(null, '', `?ch=${c}`); draw(); };
    chips.append(btn);
  }

  // The bar's arrows: a page of airlines each way, and only where there's more that way.
  const [toLeft, toRight] = document.querySelectorAll('.chipwrap .arrow');
  const arrows = () => { toLeft.hidden = chips.scrollLeft < 4; toRight.hidden = chips.scrollLeft + chips.clientWidth > chips.scrollWidth - 4; };
  toLeft.onclick = () => chips.scrollBy({ left: -chips.clientWidth * 0.7, behavior: 'smooth' });
  toRight.onclick = () => chips.scrollBy({ left: chips.clientWidth * 0.7, behavior: 'smooth' });
  chips.addEventListener('scroll', arrows, { passive: true });
  addEventListener('resize', arrows);

  function draw() {
    const board = B.boards[ch], code = board.airline, A = D.airlines[code], fleet = B.airlines[code].fleet;
    const year = A.year || 1985, t = now();
    for (const b of chips.children) b.classList.toggle('on', b.firstChild.textContent === ch);
    chips.children[channels.findIndex(([c]) => c === ch)].scrollIntoView({ block: 'nearest', inline: 'center' });
    requestAnimationFrame(arrows);

    // The airline, its biggest type in its paint, and today's date in its year.
    const then = new Date(G.thenIn(Math.floor(t / DAY), year));
    const date = then.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    const kinds = Object.keys(fleet), star = ['B747', 'DC10', 'L101', 'L15', 'A30B', 'B722'].find((k) => fleet[k]) || kinds[0];
    document.getElementById('hero').innerHTML = `<h1>${A.name}</h1><div class="when">${date} · ${clock(t, board.tz)}</div>
      <img src="${sprite(fleet[star].paints ? fleet[star].paints[0] : fleet[star])}" alt=""><div class="paint">${kinds.map((k) => fleet[k].name).join(' · ')}</div>`;

    // In the air: every flight of this airline aloft now, the longest flights first.
    const air = G.engine(D).airborne(t).filter((f) => f.airline === code).sort((a, b) => b.nm - a.nm);
    document.getElementById('airCount').textContent = `${air.length} FLIGHTS`;
    document.getElementById('air').innerHTML = air.map((f, i) => {
      const fl = paint(fleet[f.kind], f.number);
      const lands = f.depart + f.block * 60000;
      const st = f.along < 0.12 ? `CLIMBING ${Math.round(f.alt / 1000)}K` : f.along > 0.85 ? `DESCENDING ${Math.round(f.alt / 1000)}K` : `CRUISING ${Math.round(f.cruise / 1000)}K`;
      return `<div class="row" data-i="${i}"><img src="${sprite(fl)}" alt="">
        <div class="route">${city(f.from)} → ${city(f.to)}</div><div class="t">${A.code} ${f.number}</div>
        <div class="sub">${fl.name} · lands in ${Math.floor((lands - t) / 3600000)}h ${String(Math.round((lands - t) / 60000) % 60).padStart(2, '0')}m</div><div class="st">${st}</div></div>`;
    }).join('');
    document.querySelectorAll('#air .row').forEach((el) => { el.onclick = () => card(air[+el.dataset.i], code); });
    const still = open && air.find((f) => f.key === open);
    if (still) card(still, code); // the open card moves along with the list

    // Next departures: the airline's next twenty, at the time each leaves where it leaves.
    const deps = [];
    const today = Math.floor(t / DAY);
    for (const row of A.schedule) {
      const [num, from, to, leave, offset, block, , , , kind] = row;
      for (const d of [today - 1, today, today + 1]) {
        const depart = d * DAY + (offset + leave) * 60000;
        if (depart >= t && depart < t + 3 * 3600000 && G.flies(row, d, year)) deps.push({ num, from, to, depart, offset, kind });
      }
    }
    deps.sort((a, b) => a.depart - b.depart);
    document.getElementById('depNote').textContent = 'LOCAL TIMES';
    document.getElementById('deps').innerHTML = deps.slice(0, 24).map((f) =>
      `<div class="row dep"><div class="t">${localTime(f.depart, f.offset).replace(' ', '')}</div>
        <div class="route">${city(f.to)}</div><div class="t" style="text-align:right">${A.code} ${f.num}</div>
        <div class="sub">from ${city(f.from)}</div><div class="st">${fleet[f.kind] ? fleet[f.kind].name : f.kind}</div></div>`).join('')
      || '<div class="row dep"><div class="sub">Nothing leaves in the next three hours.</div></div>';
  }

  // A flight's card: its plane big, where it is, and where its times come from.
  // Where the flight is now, in words: "30 miles southeast of Chicago", or "Over the Gulf of Mexico" (and how far off
  // the nearest city, when that's close). Its place is the one the broadcast draws: along the great circle between its
  // airports, by its timetable times. Land or water from a small map loaded with the first card (landmask.js).
  // In Skyarium (from 1.11) every flight leaving from 9 p.m. or landing by 7 a.m. flies again at night as a ghost; over
  // land near a city, the card says so. Off until 1.11 is out.
  const SKYARIUM_GHOSTS = false;
  let mask = null;
  const loadMask = () => (mask ||= new Promise((ok, fail) => document.head.appendChild(Object.assign(document.createElement('script'),
    { src: 'landmask.js', onload: () => { // the runs unpacked into one byte a cell: 0 water, else a country's number
      const L = window.LANDMASK, r = Uint8Array.from(atob(L.runs), (c) => c.charCodeAt(0)), cells = new Uint8Array(L.width * L.height);
      for (let i = 0, o = 0; i < r.length; i += 2) { cells.fill(r[i], o, o + r[i + 1]); o += r[i + 1]; }
      ok(Object.assign(L, { cells }));
    }, onerror: fail }))));
  const rad = Math.PI / 180;
  function along([la1, lo1], [la2, lo2], u) { // a point u of the way along the great circle
    const p1 = [la1 * rad, lo1 * rad], p2 = [la2 * rad, lo2 * rad];
    const d = 2 * Math.asin(Math.sqrt(Math.sin((p2[0] - p1[0]) / 2) ** 2 + Math.cos(p1[0]) * Math.cos(p2[0]) * Math.sin((p2[1] - p1[1]) / 2) ** 2));
    if (d === 0) return [la1, lo1];
    const A = Math.sin((1 - u) * d) / Math.sin(d), Bk = Math.sin(u * d) / Math.sin(d);
    const x = A * Math.cos(p1[0]) * Math.cos(p1[1]) + Bk * Math.cos(p2[0]) * Math.cos(p2[1]);
    const y = A * Math.cos(p1[0]) * Math.sin(p1[1]) + Bk * Math.cos(p2[0]) * Math.sin(p2[1]);
    const z = A * Math.sin(p1[0]) + Bk * Math.sin(p2[0]);
    return [Math.atan2(z, Math.hypot(x, y)) / rad, Math.atan2(y, x) / rad];
  }
  const miles = ([la1, lo1], [la2, lo2]) => 3958.8 * 2 * Math.asin(Math.sqrt(Math.sin(((la2 - la1) * rad) / 2) ** 2 + Math.cos(la1 * rad) * Math.cos(la2 * rad) * Math.sin(((lo2 - lo1) * rad) / 2) ** 2));
  const compass = ([la1, lo1], [la2, lo2]) => { // the direction from the first point to the second
    const y = Math.sin((lo2 - lo1) * rad) * Math.cos(la2 * rad), x = Math.cos(la1 * rad) * Math.sin(la2 * rad) - Math.sin(la1 * rad) * Math.cos(la2 * rad) * Math.cos((lo2 - lo1) * rad);
    return ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'][Math.round(((Math.atan2(y, x) / rad + 360) % 360) / 45) % 8];
  };
  function water(lat, lon) {
    if (lat > 9 && lat < 22 && lon > -88 && lon < -59) return 'the Caribbean';
    if (lat > 18 && lat < 31 && lon > -98 && lon < -80) return 'the Gulf of Mexico';
    if (lat > 51 && lat < 66 && (lon > 162 || lon < -157)) return 'the Bering Sea';
    if (lat > 50 && lat < 61 && lon > -160 && lon < -130) return 'the Gulf of Alaska';
    if (lat > 30 && lat < 46 && lon > -6 && lon < 36) return 'the Mediterranean';
    if (lat > 51 && lat < 61 && lon > -4 && lon < 10) return 'the North Sea';
    if (lon < -100 || lon > 110) return 'the Pacific';
    return 'the Atlantic';
  }
  async function whereNow(f) {
    const P = D.positions, at = along(P[f.from], P[f.to], Math.min(1, Math.max(0, f.along)));
    const L = await loadMask();
    const cx = Math.floor((((at[1] + 180) % 360) + 360) % 360 / L.cell), cy = Math.floor((90 - at[0]) / L.cell);
    const country = L.cells[cy * L.width + cx], onLand = country > 0;
    let near = null, best = Infinity;
    for (const [code, p] of Object.entries(P)) { const m = miles(p, at); if (m < best) { best = m; near = code; } }
    const by = best < 8 ? `over ${city(near)}` : `${Math.round(best / 5) * 5 || 5} miles ${compass(P[near], at)} of ${city(near)}`;
    // Far from any of the station's cities, the country it's over (the north of a big one, up there).
    // Over land a city names the place out to 500 miles ("340 miles northwest of Juneau" says more than "Over Canada");
    // farther than that, the country, or Alaska, or the north of a big one.
    const land = L.names[country - 1] || 'land', north = at[0] > 58 && ['Canada', 'the Soviet Union'].includes(land);
    const alaska = land === 'the United States' && at[0] > 51 && at[1] < -129;
    const far = alaska ? 'Alaska' : north ? land.replace(/^(the )?/, (the) => `${the}northern `) : land;
    const words = !onLand ? `Over ${water(at[0], at[1])}${best < 200 ? `, ${by.replace(/^over /, 'off ')}` : ''}`
      : best < 500 ? `Now ${by}` : `Over ${far}`;
    // A ghost in Skyarium tonight: leaving from 9 p.m. or landing by 7 a.m. at its origin's clock, and over land near a city.
    const A = D.airlines[f.airline], r = A.schedule.find((x) => x[0] === f.number && x[1] === f.from && x[2] === f.to);
    const night = r && (r[3] >= 21 * 60 || (r[3] + r[5]) % 1440 <= 7 * 60);
    const sky = SKYARIUM_GHOSTS && night && onLand && best < 150 ? `In Skyarium it's crossing the sky near ${city(near)} right now.` : '';
    return { words, sky };
  }
  let open = null; // the flight on the card, kept up to date as the list redraws
  const hm = (m) => (m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`);
  function card(f, code) {
    open = f.key;
    const A = D.airlines[code], fl = paint(B.airlines[code].fleet[f.kind], f.number);
    const left = Math.max(0, Math.round((f.depart + f.block * 60000 - now()) / 60000));
    const gone = Math.max(0, Math.round((now() - f.depart) / 60000)), pct = (100 * Math.min(1, Math.max(0, f.along))).toFixed(1);
    const row = A.schedule.find((r) => r[0] === f.number && r[1] === f.from && r[2] === f.to);
    document.getElementById('cardBody').innerHTML = `<span class="close">Close ×</span><div class="big" style="padding-right: 70px">${A.code} ${f.number} · ${city(f.from)} → ${city(f.to)}</div>
      <img src="${sprite(fl)}" alt="">
      <div class="trip"><div class="ends"><span>${f.from}</span><span>${f.to}</span></div>
        <div class="track"><span class="end" style="left:0"></span><span class="end" style="left:100%"></span><span class="done" style="width:${pct}%"></span><span class="now" style="left:${pct}%"></span></div>
        <div class="times"><span>${row ? `Departed ${localTime(f.depart, row[4]).replace(' ', '')}` : `Departed ${hm(gone)} ago`}</span><span>${hm(left)} to go</span></div></div>
      <div class="where" id="where">&nbsp;</div>
      <dl><dt>Plane</dt><dd>${fl.name} · ${fl.scheme}</dd>
      <dt>Now</dt><dd>${f.along < 0.12 ? 'Climbing through' : f.along > 0.85 ? 'Descending through' : 'Cruising at'} ${(f.along < 0.12 || f.along > 0.85 ? f.alt : f.cruise).toLocaleString()} ft</dd>
      <dt>Distance</dt><dd>${Math.round(f.nm).toLocaleString()} nautical miles</dd></dl>
      <div class="src">Times from: ${A.source}. The position is simulated.</div>`;
    document.getElementById('card').classList.add('on');
    whereNow(f).then(({ words, sky }) => {
      const el = document.getElementById('where');
      if (el && open === f.key) el.innerHTML = words + (sky ? `<span class="sky">${sky}</span>` : '');
    }).catch(() => {});
  }
  document.getElementById('card').onclick = () => { document.getElementById('card').classList.remove('on'); open = null; };

  draw();
  setInterval(draw, 30000);
})();
</script>
