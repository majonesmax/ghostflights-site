<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghostflights</title>
<style>
  /* What the set's screen shows on a phone instead of the station (too heavy there): a card from the station, in its
     lettering, pointing to Skyarium for the phone and to the timetables. */
  @font-face { font-family: CG; src: url(fonts/cg.ttf) format('truetype'); }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4.5vh; text-align: center;
    background: radial-gradient(ellipse at 50% 40%, #1f2a72 0%, #16205a 45%, #0a0c22 100%); color: #f6f2e8;
    font-family: CG, 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: 0.04em; overflow: hidden; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px); }
  .bug { color: #ffbf2e; font-size: 6.5vh; letter-spacing: 0.08em; text-shadow: 0 0 6px rgba(255, 191, 46, 0.5); }
  .line { font-size: 5.6vh; line-height: 1.15; max-width: 86vw; text-shadow: 2px 2px 0 #000; }
  .small { font-size: 3.6vh; color: #c9cbe6; max-width: 84vw; line-height: 1.3; }
  .buttons { display: flex; gap: 3vw; }
  a { font-size: 4vh; color: #0a0c22; background: #ffbf2e; text-decoration: none; padding: 1.6vh 3.2vw; border-radius: 0.6vh; }
  a.quiet { color: #ffbf2e; background: transparent; border: 0.3vh solid #ffbf2e; }
</style>
</head>
<body>
  <div class="bug">Ghostflights</div>
  <div class="line">This set is made for a bigger screen</div>
  <div class="small">On your phone, look up with Skyarium. Every plane in the sky above you, named. Or tune in on a computer.</div>
  <div class="buttons"><a href="https://apps.apple.com/us/app/skyarium/id6826740904" target="_top">Get Skyarium</a><a class="quiet" href="timetable.html" target="_top">Timetables</a></div>
<script>
  // The set waits for its screen to say it's in.
  const ch = new URLSearchParams(location.search).get('ch') || '1';
  if (parent !== window) parent.postMessage({ ready: ch }, '*');
</script>
</body>
</html>
